[package]
name = "recognitor"
version = "0.1.0"
edition = "2024"
description = "Local-first Markdown memory engine for LLMs, with SQLite as a disposable projection"
publish = false
authors = ["Selçuk Öztürk"]
repository = "https://gitlab.com/selcux/recognitor"

[lib]
path = "src/lib.rs"

[[bin]]
name = "recognitor"
path = "src/main.rs"

[dependencies]
directories = "6.0.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rayon = "1.12.0"
rusqlite = { version = "0.43", features = ["bundled"] }
serde_yaml = "0.9.34"
sha2 = "0.11.1"
toml_edit = "0.25.19"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
