stages:
  - check
  - test
  - secret-detection
  - build
  - package
  - release

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

default:
  interruptible: true

.rust-linux:
  image: rust:1.85-bookworm
  before_script:
    - rustup component add clippy rustfmt

.rust-windows:
  tags:
    - saas-windows-medium-amd64
  before_script:
    - Invoke-WebRequest -Uri "https://win.rustup.rs/x86_64" -OutFile "rustup-init.exe"
    - .\rustup-init.exe -y --default-toolchain stable
    - $env:Path = "$env:USERPROFILE\.cargo\bin;" + $env:Path

# --- Check Stage ---
fmt-clippy:
  extends: .rust-linux
  stage: check
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

tag-version-check:
  extends: .rust-linux
  stage: check
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - CARGO_VER=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
    - |
      if [ "$CI_COMMIT_TAG" != "v$CARGO_VER" ]; then
        echo "Tag $CI_COMMIT_TAG does not match Cargo.toml version v$CARGO_VER"
        exit 1
      fi

# --- Test Stage ---
test-linux:
  extends: .rust-linux
  stage: test
  script:
    - cargo test --locked

test-windows:
  extends: .rust-windows
  stage: test
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - cargo test --locked

secret_detection:
  stage: secret-detection

# --- Build Stage ---
build-linux:
  extends: .rust-linux
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-gnu
    - mkdir -p dist/staging
    - cp target/x86_64-unknown-linux-gnu/release/recognitor dist/staging/
    - cp LICENSE README.md dist/staging/
    - tar -czf dist/recognitor-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz -C dist/staging .
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 1 day

build-windows:
  extends: .rust-windows
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --locked --target x86_64-pc-windows-msvc
    - New-Item -ItemType Directory -Force -Path dist\staging
    - Copy-Item target\x86_64-pc-windows-msvc\release\recognitor.exe dist\staging\
    - Copy-Item LICENSE dist\staging\
    - Copy-Item README.md dist\staging\
    - Compress-Archive -Path dist\staging\* -DestinationPath dist\recognitor-$CI_COMMIT_TAG-x86_64-pc-windows-msvc.zip
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 day

# --- Package Stage ---
publish-packages:
  image: curlimages/curl:latest
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - cd dist
    - sha256sum *.tar.gz *.zip > SHA256SUMS.txt
    - |
      for file in *.tar.gz *.zip SHA256SUMS.txt; do
        curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/${file}"
      done
  artifacts:
    paths:
      - dist/SHA256SUMS.txt
    expire_in: 1 day

# --- Release Stage ---
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: publish-packages
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Recognitor $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "recognitor-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/recognitor-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          link_type: "package"
        - name: "recognitor-$CI_COMMIT_TAG-x86_64-pc-windows-msvc.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/recognitor-${CI_COMMIT_TAG}-x86_64-pc-windows-msvc.zip"
          link_type: "package"
        - name: "SHA256SUMS.txt"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/SHA256SUMS.txt"
          link_type: "package"
