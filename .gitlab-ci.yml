stages:
  - check
  - test
  - secret-detection
  - build
  - package
  - release

include:
  - template: Security/Secret-Detection.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$/

default:
  interruptible: true

variables:
  FF_USE_FASTZIP: "true"
  CACHE_COMPRESSION_LEVEL: "fastest"

# Paths that can change what the Rust jobs do. An allowlist on purpose: `rules:changes` has no negation, and a
# `when: never` rule on docs would skip commits that mix docs and code. A commit that touches none of these runs
# only secret_detection. Any `include_str!`/`include_bytes!`/`include!` of a file outside these paths must be added
# here; tests/ci_paths.rs scans the sources and fails the build if one is missing. It understands only `prefix/**/*`
# and exact entries, so keep the list in those two forms (or extend the matcher in that test).
.code-paths: &code-paths
  - src/**/*
  - tests/**/*             # includes tests/fixtures/vault/**/*.md, which are test inputs
  - benches/**/*
  - examples/**/*
  - build.rs
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - rustfmt.toml
  - clippy.toml
  - .gitattributes         # eol=lf changes how the tests see line endings
  - .gitlab-ci.yml         # a CI edit must validate itself
  - docs/07-interface-contracts.md  # tests/integration/mcp.rs include_str!s it

.rust-linux:
  image: rust:bookworm

.rust-windows:
  tags:
    - saas-windows-medium-amd64
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR\\.cargo"
    SCCACHE_DIR: "$CI_PROJECT_DIR\\.sccache"
    SCCACHE_CACHE_SIZE: "2G"
    CARGO_INCREMENTAL: "0"
    RUSTC_WRAPPER: "sccache"
    SCCACHE_VERSION: "v0.20.1"
    SCCACHE_SHA256: "ca500a01139e9af8d5f5a5e69b6a0dd941ed79ed3399a91cc35bba484fe732fa"
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: "windows-cargo"
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/
    - key: "windows-sccache-$SCCACHE_VERSION-$CI_COMMIT_REF_SLUG"
      fallback_keys:
        - "windows-sccache-$SCCACHE_VERSION-$CI_DEFAULT_BRANCH"
      paths:
        - .sccache/
        - .tools/
  before_script:
    - curl.exe -sSfL "https://win.rustup.rs/x86_64" -o rustup-init.exe
    - .\rustup-init.exe -y --profile minimal --default-toolchain stable --no-modify-path
    - Remove-Item rustup-init.exe
    - |
      $toolsDir = "$env:CI_PROJECT_DIR\.tools"
      if (!(Test-Path "$toolsDir\sccache.exe")) {
        New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null
        $url = "https://github.com/mozilla/sccache/releases/download/$env:SCCACHE_VERSION/sccache-$env:SCCACHE_VERSION-x86_64-pc-windows-msvc.zip"
        curl.exe -sSfL $url -o sccache.zip
        if ($LASTEXITCODE -ne 0) { throw "Failed to download sccache" }
        $actual = (Get-FileHash sccache.zip -Algorithm SHA256).Hash
        if ($actual -ne $env:SCCACHE_SHA256) {
          throw "sccache SHA-256 mismatch: expected $env:SCCACHE_SHA256, got $actual"
        }
        7z e sccache.zip "-o$toolsDir" sccache.exe -r -y | Out-Null
        if ($LASTEXITCODE -ne 0) { throw "Failed to extract sccache.exe" }
        Remove-Item sccache.zip
      }
    - $env:Path = "$toolsDir;$env:USERPROFILE\.cargo\bin;$env:Path"
    - sccache --start-server
  after_script:
    - |
      $toolsDir = "$env:CI_PROJECT_DIR\.tools"
      if (Test-Path "$toolsDir\sccache.exe") {
        & "$toolsDir\sccache.exe" --show-stats
        & "$toolsDir\sccache.exe" --stop-server
      }

# --- Check Stage ---
fmt-clippy:
  extends: .rust-linux
  stage: check
  before_script:
    - rustup component add clippy rustfmt
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code-paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *code-paths
  script:
    - cargo fmt --check
    - cargo clippy --all-targets -- -D warnings

tag-version-check:
  extends: .rust-linux
  stage: check
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - CARGO_VER=$(cargo metadata --no-deps --format-version 1 | grep -o '"version":"[^"]*"' | head -1 | cut -d'"' -f4)
    - |
      if [ "$CI_COMMIT_TAG" != "v$CARGO_VER" ]; then
        echo "Tag $CI_COMMIT_TAG does not match Cargo.toml version v$CARGO_VER"
        exit 1
      fi

# --- Test Stage ---
test-linux:
  extends: .rust-linux
  stage: test
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: *code-paths
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *code-paths
  script:
    - cargo test --locked

test-windows:
  extends: .rust-windows
  stage: test
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: *code-paths
  script:
    - cargo test --locked

secret_detection:
  stage: secret-detection

# --- Build Stage ---
build-linux:
  extends: .rust-linux
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - cargo build --release --locked --target x86_64-unknown-linux-gnu
    - mkdir -p dist/staging
    - cp target/x86_64-unknown-linux-gnu/release/recognitor dist/staging/
    - cp LICENSE README.md dist/staging/
    - tar -czf dist/recognitor-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz -C dist/staging .
  artifacts:
    paths:
      - dist/*.tar.gz
    expire_in: 1 day

build-windows:
  stage: build
  tags:
    - saas-linux-medium-amd64
  image: rust:trixie
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: tag-version-check
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    XWIN_CACHE_DIR: "$CI_PROJECT_DIR/.xwin-cache"
    CARGO_XWIN_VERSION: "v0.24.1"
    CARGO_XWIN_SHA256: "207ec5436db138b60d90cb41513ce2e3db4893a9c4e25da6209790c1a2db88cf"
  cache:
    - key:
        files:
          - Cargo.lock
        prefix: "linux-xwin-cargo"
      paths:
        - .cargo/registry/index/
        - .cargo/registry/cache/
        - .cargo/git/
    - key: "xwin-sdk-${CARGO_XWIN_VERSION}"
      paths:
        - .xwin-cache/
        - .tools-linux/
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends clang llvm lld zip
    - |
      if [ ! -x "$CI_PROJECT_DIR/.tools-linux/cargo-xwin" ]; then
        mkdir -p "$CI_PROJECT_DIR/.tools-linux"
        curl -sSfL "https://github.com/rust-cross/cargo-xwin/releases/download/${CARGO_XWIN_VERSION}/cargo-xwin-${CARGO_XWIN_VERSION}.x86_64-unknown-linux-musl.tar.gz" -o cargo-xwin.tar.gz
        echo "${CARGO_XWIN_SHA256}  cargo-xwin.tar.gz" | sha256sum -c -
        tar -xzf cargo-xwin.tar.gz -C "$CI_PROJECT_DIR/.tools-linux"
        chmod +x "$CI_PROJECT_DIR/.tools-linux/cargo-xwin"
        rm -f cargo-xwin.tar.gz
      fi
    - export PATH="$CI_PROJECT_DIR/.tools-linux:$PATH"
    - rustup target add x86_64-pc-windows-msvc
  script:
    - cargo xwin build --release --locked --target x86_64-pc-windows-msvc
    - mkdir -p dist/staging
    - cp target/x86_64-pc-windows-msvc/release/recognitor.exe dist/staging/
    - cp LICENSE README.md dist/staging/
    - (cd dist/staging && zip -r "../recognitor-${CI_COMMIT_TAG}-x86_64-pc-windows-msvc.zip" .)
  artifacts:
    paths:
      - dist/*.zip
    expire_in: 1 day

# --- Package Stage ---
publish-packages:
  image: curlimages/curl:latest
  stage: package
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: fmt-clippy
    - job: tag-version-check
    - job: test-linux
    - job: test-windows
    - job: secret_detection
      optional: true
    - job: build-linux
      artifacts: true
    - job: build-windows
      artifacts: true
  script:
    - cd dist
    - sha256sum *.tar.gz *.zip > SHA256SUMS.txt
    - |
      for file in *.tar.gz *.zip SHA256SUMS.txt; do
        curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
             --upload-file "${file}" \
             "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/${file}"
      done
  artifacts:
    paths:
      - dist/SHA256SUMS.txt
    expire_in: 1 day

# --- Release Stage ---
create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - job: publish-packages
      artifacts: true
  script:
    - echo "Creating release for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Recognitor $CI_COMMIT_TAG"
    description: "Release $CI_COMMIT_TAG"
    assets:
      links:
        - name: "recognitor-$CI_COMMIT_TAG-x86_64-unknown-linux-gnu.tar.gz"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/recognitor-${CI_COMMIT_TAG}-x86_64-unknown-linux-gnu.tar.gz"
          link_type: "package"
        - name: "recognitor-$CI_COMMIT_TAG-x86_64-pc-windows-msvc.zip"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/recognitor-${CI_COMMIT_TAG}-x86_64-pc-windows-msvc.zip"
          link_type: "package"
        - name: "SHA256SUMS.txt"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/recognitor/${CI_COMMIT_TAG}/SHA256SUMS.txt"
          link_type: "package"
